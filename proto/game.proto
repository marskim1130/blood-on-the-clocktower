syntax = "proto3";

package clocktower;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/your-org/blood-on-the-clocktower/internal/game";

// json_required marks fields that must be present in the flattened JSON contract.
extend google.protobuf.FieldOptions {
  bool json_required = 50001;
}

// Player represents a player in the game
message Player {
  string id = 1 [(json_required) = true];
  string name = 2 [(json_required) = true];
  optional Character character = 3;
  bool is_alive = 4 [(json_required) = true];
  int32 votes = 5 [(json_required) = true];
  optional int32 poisoned_until = 6;
  optional Character shown_character = 7;
  bool is_ready = 8 [(json_required) = true];
  bool has_confirmed_character = 9 [(json_required) = true];
}

// Character represents a character role
message Character {
  string id = 1 [(json_required) = true];
  string name = 2 [(json_required) = true];
  Team team = 3 [(json_required) = true];
  string ability = 4 [(json_required) = true];
}

// Team enum
enum Team {
  TEAM_UNSPECIFIED = 0;
  TEAM_GOOD = 1;
  TEAM_EVIL = 2;
}

// GamePhase enum
enum GamePhase {
  GAME_PHASE_UNSPECIFIED = 0;
  GAME_PHASE_SETUP = 1;
  GAME_PHASE_DAY = 2;
  GAME_PHASE_NIGHT = 3;
  GAME_PHASE_VOTING = 4;
  GAME_PHASE_FINISHED = 5;
}

// DeathCause represents why a player died
enum DeathCause {
  DEATH_CAUSE_UNSPECIFIED = 0;
  DEATH_CAUSE_EXECUTION = 1;
  DEATH_CAUSE_NIGHT_KILL = 2;
  DEATH_CAUSE_ABILITY = 3;
}

// NightActionType represents a storyteller-adjudicated night action
enum NightActionType {
  NIGHT_ACTION_TYPE_UNSPECIFIED = 0;
  NIGHT_ACTION_TYPE_POISON = 1;
  NIGHT_ACTION_TYPE_PROTECT = 2;
  NIGHT_ACTION_TYPE_KILL = 3;
  NIGHT_ACTION_TYPE_LEARN_TOWNSFOLK = 4;
  NIGHT_ACTION_TYPE_LEARN_OUTSIDER = 5;
  NIGHT_ACTION_TYPE_LEARN_MINION = 6;
  NIGHT_ACTION_TYPE_LEARN_EVIL_PAIRS = 7;
  NIGHT_ACTION_TYPE_LEARN_EVIL_NEIGHBORS = 8;
  NIGHT_ACTION_TYPE_CHECK_DEMON = 9;
  NIGHT_ACTION_TYPE_LEARN_EXECUTED = 10;
  NIGHT_ACTION_TYPE_LEARN_DIED = 11;
  NIGHT_ACTION_TYPE_LEARN_MASTER = 12;
  NIGHT_ACTION_TYPE_LEARN_DEMON = 13;
  NIGHT_ACTION_TYPE_CHOOSE_PLAYER = 14;
  NIGHT_ACTION_TYPE_NONE = 15;
}

// WinReason represents why the game ended
enum WinReason {
  WIN_REASON_UNSPECIFIED = 0;
  WIN_REASON_IMP_EXECUTED = 1;
  WIN_REASON_MAYOR_ENDGAME = 2;
  WIN_REASON_EVIL_MAJORITY = 3;
  WIN_REASON_SAINT_EXECUTED = 4;
  WIN_REASON_IMP_STARPASS = 5;
  WIN_REASON_STORYTELLER_DECISION = 6;
}

// ClientMessageType is the protocol v2 client command discriminator.
enum ClientMessageType {
  CLIENT_MESSAGE_TYPE_UNSPECIFIED = 0;
  CLIENT_MESSAGE_TYPE_CREATE_ROOM = 1;
  CLIENT_MESSAGE_TYPE_JOIN_ROOM = 2;
  CLIENT_MESSAGE_TYPE_RESUME_ROOM = 3;
  CLIENT_MESSAGE_TYPE_REJOIN_ROOM = 4;
  CLIENT_MESSAGE_TYPE_GET_ROOM_STATE = 5;
  CLIENT_MESSAGE_TYPE_CLOSE_ROOM = 6;
  CLIENT_MESSAGE_TYPE_LEAVE_ROOM = 7;
  CLIENT_MESSAGE_TYPE_KICK_PLAYER = 8;
  CLIENT_MESSAGE_TYPE_UPDATE_ROOM_SETTINGS = 9;
  CLIENT_MESSAGE_TYPE_SET_STORYTELLER = 10;
  CLIENT_MESSAGE_TYPE_ASSIGN_CHARACTERS = 11;
  CLIENT_MESSAGE_TYPE_SUBMIT_EVENT = 12;
  CLIENT_MESSAGE_TYPE_START_GAME = 13;
  CLIENT_MESSAGE_TYPE_CHANGE_PHASE = 14;
  CLIENT_MESSAGE_TYPE_NOMINATE = 15;
  CLIENT_MESSAGE_TYPE_CAST_VOTE = 16;
  CLIENT_MESSAGE_TYPE_RESOLVE_NOMINATION = 17;
  CLIENT_MESSAGE_TYPE_EXECUTE_PLAYER = 18;
  CLIENT_MESSAGE_TYPE_USE_SLAYER_ABILITY = 19;
  CLIENT_MESSAGE_TYPE_KILL_PLAYER = 20;
  CLIENT_MESSAGE_TYPE_SUBMIT_NIGHT_ACTION = 21;
  CLIENT_MESSAGE_TYPE_RESOLVE_NIGHT = 22;
  CLIENT_MESSAGE_TYPE_END_GAME = 23;
  CLIENT_MESSAGE_TYPE_SET_SEAT_ORDER = 24;
  CLIENT_MESSAGE_TYPE_SET_READY = 25;
  CLIENT_MESSAGE_TYPE_CONFIRM_CHARACTER = 26;
  CLIENT_MESSAGE_TYPE_FINALIZE_DAY = 27;
  CLIENT_MESSAGE_TYPE_RECORD_VOTE = 28;
  CLIENT_MESSAGE_TYPE_CONFIRM_NIGHT_ACTION = 29;
  CLIENT_MESSAGE_TYPE_ACKNOWLEDGE_NIGHT_ACTION = 30;
  CLIENT_MESSAGE_TYPE_SKIP_NIGHT_ACTION = 31;
  CLIENT_MESSAGE_TYPE_PUBLISH_GRIMOIRE = 32;
  CLIENT_MESSAGE_TYPE_PREPARE_DAWN = 33;
  CLIENT_MESSAGE_TYPE_CONFIRM_DAWN = 34;
  CLIENT_MESSAGE_TYPE_ADVANCE_NOMINATION_STAGE = 35;
  CLIENT_MESSAGE_TYPE_CONTROL_NOMINATION_TIMER = 36;
  CLIENT_MESSAGE_TYPE_EXPIRE_NOMINATION_TIMER = 37;
  CLIENT_MESSAGE_TYPE_TRANSFER_OWNERSHIP = 38;
  CLIENT_MESSAGE_TYPE_RESTART_GAME = 39;
  CLIENT_MESSAGE_TYPE_UNDO_GAME = 40;
  CLIENT_MESSAGE_TYPE_REDO_GAME = 41;
  CLIENT_MESSAGE_TYPE_REQUEST_RECOVERY = 42;
  CLIENT_MESSAGE_TYPE_REVIEW_RECOVERY = 43;
  CLIENT_MESSAGE_TYPE_GET_RECOVERY_REQUESTS = 44;
}

// ServerMessageType is the protocol v2 server message discriminator.
enum ServerMessageType {
  SERVER_MESSAGE_TYPE_UNSPECIFIED = 0;
  SERVER_MESSAGE_TYPE_CREATE_ROOM_RESULT = 1;
  SERVER_MESSAGE_TYPE_JOIN_ROOM_RESULT = 2;
  SERVER_MESSAGE_TYPE_RESUME_ROOM_RESULT = 3;
  SERVER_MESSAGE_TYPE_COMMAND_RESULT = 4;
  SERVER_MESSAGE_TYPE_ROOM_STATE = 5;
  SERVER_MESSAGE_TYPE_ROOM_STATE_CHANGED = 6;
  SERVER_MESSAGE_TYPE_KICKED = 7;
  SERVER_MESSAGE_TYPE_ROOM_CLOSED = 8;
  SERVER_MESSAGE_TYPE_ERROR = 9;
  SERVER_MESSAGE_TYPE_RECOVERY_STATUS = 10;
  SERVER_MESSAGE_TYPE_RECOVERY_REQUESTS = 11;
  SERVER_MESSAGE_TYPE_SESSION_REPLACED = 12;
}

// ProtocolErrorCode is the stable machine-readable protocol v2 error set.
enum ProtocolErrorCode {
  PROTOCOL_ERROR_CODE_UNSPECIFIED = 0;
  PROTOCOL_ERROR_CODE_INVALID_MESSAGE = 1;
  PROTOCOL_ERROR_CODE_UNSUPPORTED_PROTOCOL = 2;
  PROTOCOL_ERROR_CODE_ROOM_NOT_FOUND = 3;
  PROTOCOL_ERROR_CODE_INVALID_CREDENTIAL = 4;
  PROTOCOL_ERROR_CODE_STALE_CONNECTION = 5;
  PROTOCOL_ERROR_CODE_FORBIDDEN = 6;
  PROTOCOL_ERROR_CODE_PARTICIPANT_SET_FROZEN = 7;
  PROTOCOL_ERROR_CODE_UNEXPECTED_SEQUENCE = 8;
  PROTOCOL_ERROR_CODE_SEQUENCE_CONFLICT = 9;
  PROTOCOL_ERROR_CODE_IDEMPOTENCY_CONFLICT = 10;
  PROTOCOL_ERROR_CODE_PERSISTENCE_UNAVAILABLE = 11;
  PROTOCOL_ERROR_CODE_PERSISTENCE_CONFLICT = 12;
  PROTOCOL_ERROR_CODE_INTERNAL = 13;
  PROTOCOL_ERROR_CODE_ROOM_FULL = 14;
  PROTOCOL_ERROR_CODE_INVALID_COMMAND = 15;
}

enum IdentityState {
  IDENTITY_STATE_UNSPECIFIED = 0;
  IDENTITY_STATE_MEMBER = 1;
  IDENTITY_STATE_RETAINED = 2;
}

// GameState represents the complete state of a game
message GameState {
  string id = 1;
  GamePhase phase = 2;
  repeated Player players = 3;
  int32 day_number = 4;
  optional string storyteller_id = 5;
  map<string, string> votes = 6;  // voter_id -> target_id
  repeated DeathRecord deaths = 7;
  optional Nomination nomination = 8;
  repeated NightAction night_actions = 9;
  optional Team winner = 10;
}

// Game events for WebSocket communication
message GameEvent {
  oneof event {
    PlayerJoined player_joined = 1;
    PlayerLeft player_left = 2;
    PhaseChanged phase_changed = 3;
    VoteCast vote_cast = 4;
    CharacterAssigned character_assigned = 5;
    PlayerDied player_died = 6;
    NominationStarted nomination_started = 7;
    NominationResolved nomination_resolved = 8;
    NightActionSubmitted night_action_submitted = 9;
    GameEnded game_ended = 10;
  }
}

message DeathRecord {
  string player_id = 1 [(json_required) = true];
  DeathCause cause = 2 [(json_required) = true];
  int32 day_number = 3 [(json_required) = true];
  optional string killed_by = 4;
}

message Nomination {
  string nominator_id = 1 [(json_required) = true];
  string nominee_id = 2 [(json_required) = true];
  map<string, bool> votes = 3 [(json_required) = true];  // voter_id -> decision
  bool resolved = 4 [(json_required) = true];
  repeated string voter_order = 5 [(json_required) = true];
  int32 current_voter_index = 6 [(json_required) = true];
  optional string stage = 7;
  optional int64 deadline_unix_ms = 8;
  optional bool paused = 9;
  optional int64 remaining_ms = 10;
}

message NightAction {
  string actor_id = 1 [(json_required) = true];
  NightActionType action_type = 2 [(json_required) = true];
  repeated string target_ids = 3 [(json_required) = true];
  optional string result = 4;
}

message PlayerJoined {
  Player player = 1;
}

message PlayerLeft {
  string player_id = 1;
}

message PhaseChanged {
  GamePhase phase = 1;
}

message VoteCast {
  string voter_id = 1;
  optional string target_id = 2;
  optional bool decision = 3;
}

message CharacterAssigned {
  string player_id = 1;
  Character character = 2;
  optional Character shown_character = 3;
}

message PlayerDied {
  string player_id = 1;
  DeathCause cause = 2;
  int32 day_number = 3;
}

message NominationStarted {
  string nominator_id = 1;
  string nominee_id = 2;
}

message NominationResolved {
  string nominee_id = 1;
  bool executed = 2;
  int32 yes_votes = 3;
  int32 no_votes = 4;
  int32 required_votes = 5;
}

message NightActionSubmitted {
  string actor_id = 1;
  NightActionType action_type = 2;
  repeated string target_ids = 3;
  optional string result = 4;
}

message GameEnded {
  Team winner = 1 [(json_required) = true];
  WinReason reason = 2 [(json_required) = true];
  string description = 3 [(json_required) = true];
}

// ClientMessage describes the flattened JSON envelope used on the wire.
message ClientMessage {
  int32 protocol_version = 1 [(json_required) = true];
  ClientMessageType type = 2 [(json_required) = true];
  optional string request_id = 3;
  optional string join_request_id = 4;
  optional string resume_credential = 5;
  optional uint64 client_sequence = 6;
  optional string room_id = 7;
  optional string player_name = 8;
  optional string player_id = 9;
  optional string target_player_id = 10;
  optional int32 max_players = 11;
  optional string script_id = 12;
  map<string, string> assignments = 13;
  map<string, string> shown_characters = 14;
  optional string fortune_teller_red_herring_id = 15;
  optional GameEvent event = 16;
  optional string nominee_id = 17;
  optional bool decision = 18;
  optional GamePhase phase = 19;
  optional Team winner = 20;
  optional string reason = 21;
  optional string description = 22;
  optional DeathCause cause = 23;
  optional string action_type = 24;
  repeated string target_ids = 25;
  optional string result = 26;
  repeated string seat_order = 27;
  optional bool ready = 28;
  repeated string demon_bluff_character_ids = 29;
  optional string timer_action = 30;
  optional int64 deadline_unix_ms = 31;
  optional bool confirm_phase_change = 32;
  optional string recovery_credential = 33;
  optional string recovery_request_id = 34;
}

message OperationLogEntry {
  uint64 id = 1 [(json_required) = true];
  string action = 2 [(json_required) = true];
  string actor_id = 3 [(json_required) = true];
  int64 created_at_unix_ms = 4 [(json_required) = true];
  GamePhase from_phase = 5 [(json_required) = true];
  GamePhase to_phase = 6 [(json_required) = true];
  bool disclosure_warning = 7 [(json_required) = true];
}

message RecoveryRequest {
  string request_id = 1 [(json_required) = true];
  string player_id = 2 [(json_required) = true];
  string player_name = 3 [(json_required) = true];
  int64 requested_at_unix_ms = 4 [(json_required) = true];
}

message NominationResult {
  int32 day_number = 1 [(json_required) = true];
  string nominator_id = 2 [(json_required) = true];
  string nominee_id = 3 [(json_required) = true];
  map<string, bool> votes = 4 [(json_required) = true];
  int32 yes_votes = 5 [(json_required) = true];
  int32 no_votes = 6 [(json_required) = true];
  int32 required_votes = 7 [(json_required) = true];
}

message IdentityStatus {
  IdentityState status = 1 [(json_required) = true];
  bool can_rejoin = 2 [(json_required) = true];
  bool participant_set_frozen = 3 [(json_required) = true];
  optional uint64 next_client_sequence = 4;
}

message NightWakeStep {
  string character_id = 1 [(json_required) = true];
  optional string character_type = 2;
  int32 order = 3 [(json_required) = true];
  string action_type = 4 [(json_required) = true];
  string prompt = 5 [(json_required) = true];
  int32 min_targets = 6 [(json_required) = true];
  int32 max_targets = 7 [(json_required) = true];
}

// RoomState is a complete recipient-specific real-time game session projection.
message RoomState {
  string room_id = 1 [(json_required) = true];
  repeated Player players = 2 [(json_required) = true];
  int32 max_players = 3 [(json_required) = true];
  string script_id = 4 [(json_required) = true];
  string script_name = 5 [(json_required) = true];
  optional string creator_id = 6;
  optional string storyteller_id = 7;
  GamePhase phase = 8 [(json_required) = true];
  int32 day_number = 9 [(json_required) = true];
  optional Nomination nomination = 10;
  repeated DeathRecord deaths = 11;
  repeated string ghost_votes_remaining = 12;
  repeated NightWakeStep night_wake_steps = 13;
  int32 current_night_wake_index = 14;
  optional NightWakeStep current_night_wake_step = 15;
  optional GameEnded winner = 16;
  repeated NightAction night_actions = 17;
  optional string storyteller_name = 18;
  int32 night_number = 19 [(json_required) = true];
  optional string fortune_teller_red_herring_id = 20;
  repeated NominationResult nomination_results = 21;
  optional string execution_candidate_id = 22;
  optional int32 execution_candidate_votes = 23;
  optional bool execution_tied = 24;
  optional string night_turn_status = 25;
  optional NightAction pending_night_action = 26;
  optional NightAction confirmed_night_action = 27;
  repeated string demon_bluff_character_ids = 28;
  optional bool grimoire_revealed = 29;
  optional bool dawn_review_pending = 30;
  repeated string pending_dawn_death_ids = 31;
  repeated OperationLogEntry operation_log = 32;
  optional bool can_undo = 33;
  optional bool can_redo = 34;
  optional bool undo_crosses_phase = 35;
  optional bool redo_crosses_phase = 36;
}

message ServerMessage {
  ServerMessageType type = 1 [(json_required) = true];
  optional ProtocolErrorCode code = 2;
  optional string room_id = 3;
  optional RoomState state = 4;
  optional IdentityStatus identity_status = 5;
  optional string error = 6;
  optional string resume_credential = 7;
  optional uint64 room_revision = 8;
  optional uint64 accepted_sequence = 9;
  optional uint64 next_client_sequence = 10;
  optional string player_id = 11;
  optional string recovery_request_id = 12;
  optional string recovery_status = 13;
  optional string recovery_credential = 14;
  repeated RecoveryRequest recovery_requests = 15;
}
